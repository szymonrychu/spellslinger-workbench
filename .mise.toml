[tools]
python = "3.14.6"
uv = "0.12.23"
ruff = "0.15.20"
shellcheck = "0.11.0"
bats = "1.13.0"
node = "24.20.0"
jq = "1.8.2"
gitleaks = "8.30.1"
gh = "2.101.0"
"pipx:pytest" = "9.1.1"
"pipx:pre-commit" = "4.6.0"
"pipx:pre-commit-hooks" = "6.0.0"

[tasks.test]
description = "Run every test family (mise-tasks/test/*)"
depends = ["test:*"]

[tasks.lint]
description = "Run every lint family (mise-tasks/lint/*)"
depends = ["lint:*"]

[tasks.fmt]
description = "Format python"
run = "ruff format plugins scripts"

# workbench:code-tasks:begin
[tasks."code:test"]
description = "Run test in every component"
run = [
  "mise run --cd code/spellslinger-cards test",
  "mise run --cd code/spellslinger-cli test",
  "mise run --cd code/spellslinger-codex test",
  "mise run --cd code/spellslinger-deckbuilder test",
  "mise run --cd code/spellslinger-docs test",
  "mise run --cd code/spellslinger-golang-repo-seed test",
  "mise run --cd code/spellslinger-helmfile test",
  "mise run --cd code/spellslinger-identity test",
  "mise run --cd code/spellslinger-knowledge test",
  "mise run --cd code/spellslinger-lightrag test",
  "mise run --cd code/spellslinger-llm-queue test",
  "mise run --cd code/spellslinger-login test",
]

[tasks."code:lint"]
description = "Run lint in every component"
run = [
  "mise run --cd code/spellslinger-cards lint",
  "mise run --cd code/spellslinger-cli lint",
  "mise run --cd code/spellslinger-codex lint",
  "mise run --cd code/spellslinger-deckbuilder lint",
  "mise run --cd code/spellslinger-docs lint",
  "mise run --cd code/spellslinger-golang-repo-seed lint",
  "mise run --cd code/spellslinger-helmfile lint",
  "mise run --cd code/spellslinger-identity lint",
  "mise run --cd code/spellslinger-knowledge lint",
  "mise run --cd code/spellslinger-lightrag lint",
  "mise run --cd code/spellslinger-llm-queue lint",
  "mise run --cd code/spellslinger-login lint",
]

[tasks."code:fmt"]
description = "Run fmt in every component"
run = [
  "mise run --cd code/spellslinger-cards fmt",
  "mise run --cd code/spellslinger-cli fmt",
  "mise run --cd code/spellslinger-codex fmt",
  "mise run --cd code/spellslinger-deckbuilder fmt",
  "mise run --cd code/spellslinger-docs fmt",
  "mise run --cd code/spellslinger-golang-repo-seed fmt",
  "mise run --cd code/spellslinger-helmfile fmt",
  "mise run --cd code/spellslinger-identity fmt",
  "mise run --cd code/spellslinger-knowledge fmt",
  "mise run --cd code/spellslinger-lightrag fmt",
  "mise run --cd code/spellslinger-llm-queue fmt",
  "mise run --cd code/spellslinger-login fmt",
]
# workbench:code-tasks:end
